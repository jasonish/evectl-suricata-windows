name: build

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel

      - name: Install build dependencies
        run: ./scripts/install-deps.sh

      # Tags of the form <suricata>-<release> (e.g. 8.0.7-1) are releases and
      # must match versions.env. Any other tag is a test prerelease.
      - name: Check tag matches versions.env
        id: tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            source versions.env
            expected="${SURICATA_VERSION}-${PACKAGE_RELEASE}"
            if [[ "$tag" != "$expected" ]]; then
              echo "Tag $tag does not match versions.env ($expected)" >&2
              exit 1
            fi
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and package
        run: ./build.sh

      - name: Show artifacts
        run: ls -la dist && cat dist/SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: suricata-windows-x86_64
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
          files: |
            dist/*.zip
            dist/SHA256SUMS
          body: |
            Suricata ${{ github.ref_name }} for Windows (x86_64), built with MSYS2 UCRT64
            against the Npcap SDK. The Npcap runtime is **not** included; install
            Npcap separately. See BUILD-INFO.txt inside the archive for details.
