name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel

      - name: Install build dependencies
        run: ./scripts/install-deps.sh

      - name: Check tag matches versions.env
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          source versions.env
          expected="v${SURICATA_VERSION}-${PACKAGE_RELEASE}"
          tag="${GITHUB_REF#refs/tags/}"
          if [[ "$tag" != "$expected" ]]; then
            echo "Tag $tag does not match versions.env ($expected)" >&2
            exit 1
          fi

      - name: Build and package
        run: ./build.sh

      - name: Show artifacts
        run: ls -la dist && cat dist/SHA256SUMS

      - uses: actions/upload-artifact@v5
        with:
          name: suricata-windows-x86_64
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS
          body: |
            Suricata ${{ github.ref_name }} for Windows (x86_64), built with MSYS2 UCRT64
            against the Npcap SDK. The Npcap runtime is **not** included; install
            Npcap separately. See BUILD-INFO.txt inside the archive for details.
